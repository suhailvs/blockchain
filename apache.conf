<VirtualHost *:8002>
	WSGIDaemonProcess node2app python-home=/var/www/node2/env python-path=/var/www/node2/
	WSGIProcessGroup node2app
	WSGIScriptAlias / /var/www/node2/mysite/wsgi.py

	Alias /static/ /var/www/node2/staticfiles/
	<Directory /var/www/node2/staticfiles>
	Require all granted
	</Directory>
</VirtualHost>

<VirtualHost *:8003>
	WSGIDaemonProcess node3app python-home=/var/www/node2/env python-path=/var/www/node3/
	WSGIProcessGroup node3app
	WSGIScriptAlias / /var/www/node3/mysite/wsgi.py
</VirtualHost>

<VirtualHost *:8004>
	WSGIDaemonProcess node4app python-home=/var/www/node2/env python-path=/var/www/node4/
	WSGIProcessGroup node4app
	WSGIScriptAlias / /var/www/node4/mysite/wsgi.py
</VirtualHost>
